services:
  api:
    build: &shared-build
      context: .
      dockerfile: Dockerfile.api
    container_name: algobet-scheduler-api
    ports:
      - "8002:8000"
    environment:
      POSTGRES_HOST: algobet-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: algobet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football
      REDIS_URL: redis://algobet-redis:6379/0
    volumes:
      - ./algobet:/app/algobet
      - ./data:/app/data
    command: uvicorn algobet.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - algobet-net
    depends_on:
      - db
      - redis

  scheduler:
    build: *shared-build
    container_name: algobet-scheduler-worker
    environment:
      POSTGRES_HOST: algobet-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: algobet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football
      REDIS_URL: redis://algobet-redis:6379/0
    volumes:
      - ./algobet:/app/algobet
      - ./data:/app/data
    command: python -m algobet.scheduler.worker run --interval 60
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - algobet-net
    depends_on:
      - db
      - redis

  db:
    image: postgres:18-alpine
    container_name: algobet-db
    environment:
      POSTGRES_USER: algobet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U algobet -d football" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algobet-net

  redis:
    image: redis:8-alpine
    container_name: algobet-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algobet-net

volumes:
  pgdata:

networks:
  algobet-net:
    driver: bridge
