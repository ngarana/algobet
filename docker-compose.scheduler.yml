services:
  api:
    build: &shared-build
      context: .
      dockerfile: Dockerfile.api
    container_name: algobet-scheduler-api
    ports:
      - "8002:8000"
    environment:
      POSTGRES_HOST: algobet-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: algobet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football
    volumes:
      - ./algobet:/app/algobet
      - ./data:/app/data
    command: uvicorn algobet.api.main:app --host 0.0.0.0 --port 8000 --reload
    network_mode: host

  scheduler:
    build: *shared-build
    container_name: algobet-scheduler-worker
    environment:
      POSTGRES_HOST: algobet-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: algobet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football
    volumes:
      - ./algobet:/app/algobet
      - ./data:/app/data
    command: python -m algobet.scheduler.worker run --interval 60
    restart: unless-stopped
    healthcheck:
      disable: true
    network_mode: host
